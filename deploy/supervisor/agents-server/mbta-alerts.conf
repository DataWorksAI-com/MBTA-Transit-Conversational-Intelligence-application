[program:mbta-alerts]
command=/opt/mbta-agents/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/opt/mbta-agents/agents/alerts
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-alerts.out.log
stderr_logfile=/var/log/mbta-alerts.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    PYTHONPATH="/opt/mbta-agents",
    AGENT_ID="mbta-alerts",
    ANS_TLD="agents.dataworksai.com",
    ANS_APP="mbta-transit-ci",
    ANS_LABEL="alerts",
    REGISTRY_URL="http://97.107.132.213:6900",
    MBTA_API_KEY="%(ENV_MBTA_API_KEY)s",
    OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s"
