[program:mbta-fares]
command=/opt/mbta-fares/venv/bin/python /opt/mbta-fares/slim_wrapper.py
directory=/opt/mbta-fares
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-fares.out.log
stderr_logfile=/var/log/mbta-fares.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=
    PUBLIC_IP="${FARES_PUBLIC_IP}",
    AGENT_HOST="0.0.0.0",
    AGENT_PORT="50054",
    AGENT_ID="${FARES_AGENT_ID}",
    ANS_LABEL="fares",
    ANS_TLD="${ANS_TLD}",
    ANS_APP="${ANS_APP}",
    AGENT_REGION="${FARES_REGION}",
    AGENT_REGION_LABEL="${FARES_REGION_LABEL}",
    AGENT_FLAG="${FARES_FLAG}",
    AGENT_DESCRIPTION="${FARES_DESCRIPTION}",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    AUTH_NS_URL="${FARES_AUTH_NS_URL}",
    OPENAI_API_KEY="${OPENAI_API_KEY}"
