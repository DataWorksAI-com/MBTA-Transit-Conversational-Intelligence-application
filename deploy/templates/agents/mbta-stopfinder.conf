[program:mbta-stopfinder]
command=/opt/mbta-agents/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8003
directory=/opt/mbta-agents/agents/stopfinder
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-stopfinder.out.log
stderr_logfile=/var/log/mbta-stopfinder.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    PYTHONPATH="/opt/mbta-agents",
    AGENT_ID="mbta-stopfinder",
    ANS_TLD="${ANS_TLD}",
    ANS_APP="${ANS_APP}",
    ANS_LABEL="stopfinder",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    OTEL_ENDPOINT="${OTEL_ENDPOINT}",
    MBTA_API_KEY="${MBTA_API_KEY}",
    OPENAI_API_KEY="${OPENAI_API_KEY}"
