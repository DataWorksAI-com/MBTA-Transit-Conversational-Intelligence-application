[program:mbta-alerts]
command=/opt/mbta-agents/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/opt/mbta-agents/agents/alerts
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-alerts.out.log
stderr_logfile=/var/log/mbta-alerts.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    PYTHONPATH="/opt/mbta-agents",
    AGENT_ID="mbta-alerts",
    ANS_TLD="${ANS_TLD}",
    ANS_APP="${ANS_APP}",
    ANS_LABEL="alerts",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    OTEL_ENDPOINT="${OTEL_ENDPOINT}",
    MBTA_API_KEY="${MBTA_API_KEY}",
    OPENAI_API_KEY="${OPENAI_API_KEY}"
