[program:mbta-frontend]
command=/opt/mbta-agentcy/venv/bin/python -m frontend.chat_server
directory=/opt/mbta-agentcy/src
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-frontend.out.log
stderr_logfile=/var/log/mbta-frontend.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    PYTHONPATH="/opt/mbta-agentcy/src",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    ANS_RESOLVER_URL="http://${EXCHANGE_IP}:8200",
    AGENTNS_URL="http://${REGISTRY_IP}/dans",
    AGENT_HOST="${AGENTS_IP}",
    OTEL_ENDPOINT="${OTEL_ENDPOINT}"
