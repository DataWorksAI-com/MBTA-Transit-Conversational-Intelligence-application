[program:mbta-exchange]
command=/opt/mbta-agentcy/venv/bin/python -m uvicorn exchange_agent.exchange_server:app --host 0.0.0.0 --port 8100
directory=/opt/mbta-agentcy/src
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-exchange.out.log
stderr_logfile=/var/log/mbta-exchange.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=
    PYTHONPATH="/opt/mbta-agentcy/src",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    ANS_ENABLED="true",
    ANS_RESOLVER_URL="http://${EXCHANGE_IP}:8200",
    ANS_RESOLVER_TIMEOUT="5.0",
    ANS_TLD="${ANS_TLD}",
    ANS_APP="${ANS_APP}",
    AGENTNS_URL="http://${REGISTRY_IP}/dans",
    USE_SLIM="true",
    SLIM_ENDPOINT="http://${AGENTS_IP}:46357",
    SLIM_SHARED_SECRET="${SLIM_SHARED_SECRET}",
    SLIM_ORG="mbta",
    SLIM_NS="transit-ci",
    SLIM_TIMEOUT="60.0",
    OTEL_ENDPOINT="${OTEL_ENDPOINT}",
    OPENAI_API_KEY="${OPENAI_API_KEY}",
    MBTA_API_KEY="${MBTA_API_KEY}"
