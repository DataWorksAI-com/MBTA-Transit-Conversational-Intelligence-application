[program:mbta-resolver]
command=/opt/mbta-agentcy/venv/bin/python /opt/mbta-agentcy/ans/recursive_resolver.py
directory=/opt/mbta-agentcy/ans
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mbta-resolver.out.log
stderr_logfile=/var/log/mbta-resolver.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=
    PYTHONPATH="/opt/mbta-agentcy",
    REGISTRY_URL="http://${REGISTRY_IP}:6900",
    ANS_TLD="${ANS_TLD}",
    ANS_APP="${ANS_APP}",
    RESOLVER_PORT="8200",
    RESOLVER_TIMEOUT="10.0"
